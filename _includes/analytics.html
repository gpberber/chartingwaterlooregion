<!--
  GoatCounter: counts page views without cookies and without tracking individual
  people, which is why the site needs no consent banner. Wired into every page by
  the include-in-header line in _quarto.yml.

  Replace YOURCODE below with the code chosen when signing up at goatcounter.com;
  it is the first part of the dashboard address, https://YOURCODE.goatcounter.com.
  The code is public by design - it appears in the page source of every visitor -
  so it is not a secret and belongs in the repository.

  The script ignores localhost, so local previews do not pollute the numbers.
-->
<script data-goatcounter="https://YOURCODE.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
