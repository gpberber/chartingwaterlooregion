<!-- ---------------------------------------------------------------------------
     Share controls.

     Two of them, both built here because they behave identically and differ only
     in what they point at:

       - in the navbar, on every page, sharing the site's home page;
       - at the right-hand end of a post's category row, sharing that post.

     Each opens a small menu with two choices: copy the link, or open an email
     about it. Nothing is sent anywhere and no third-party script is loaded - the
     copy uses the browser's own clipboard and the email is an ordinary mailto:
     link that opens the reader's mail app. That is the reason for building this
     by hand rather than turning on Quarto's `sharing:` option, which only offers
     Twitter, Facebook and LinkedIn and loads their buttons.

     Built in JavaScript rather than in the page template because both the navbar
     and the title banner are generated by Quarto's own Pandoc templates.
     Overriding those would mean keeping copies in step with every Quarto release;
     finding the spots after the page loads costs nothing and cannot break a
     render. It also means readers without JavaScript simply see no share buttons,
     which is the right outcome - the buttons would do nothing for them.

     Styling lives in custom.scss under "Share controls". This file is pulled in
     site-wide by `include-after-body` in _quarto.yml.
--------------------------------------------------------------------------- -->
<script>
(() => {
  // Every control registers a way to shut itself, so opening one closes the other.
  const closers = [];

  // Build one control. `tag` and `wrapClass` place it in its surroundings, and
  // `triggerClass` and `trigger` decide what the button looks like - an outlined
  // "Share" in the post header, a bare icon in the navbar. The JavaScript hooks
  // on to data attributes rather than to those classes, so the two can be styled
  // independently without breaking the behaviour.
  const buildControl = ({ url, subject, label, tag, wrapClass, triggerClass, trigger }) => {
    const mailto = "mailto:?subject=" + encodeURIComponent(subject) +
                   "&body=" + encodeURIComponent(subject + "\n\n" + url);

    const wrap = document.createElement(tag);
    wrap.className = "cwr-share " + wrapClass;
    wrap.innerHTML = `
      <button type="button" class="${triggerClass}" data-share-trigger
              aria-expanded="false" aria-haspopup="true" aria-label="${label}">
        ${trigger}
      </button>
      <div class="cwr-share-menu" role="menu" hidden>
        <button type="button" class="cwr-share-item" role="menuitem" data-share-copy>
          <i class="bi bi-link-45deg" aria-hidden="true"></i>Copy link
        </button>
        <a class="cwr-share-item" role="menuitem" href="${mailto}">
          <i class="bi bi-envelope" aria-hidden="true"></i>Email
        </a>
      </div>
      <p class="cwr-share-done" role="status" hidden>
        <i class="bi bi-check2" aria-hidden="true"></i>Link copied
      </p>`;

    const button = wrap.querySelector("[data-share-trigger]");
    const menu   = wrap.querySelector(".cwr-share-menu");
    const done   = wrap.querySelector(".cwr-share-done");

    // `hidden` rather than a display rule, so a shut menu is out of the
    // accessibility tree as well as off the screen.
    const open = (yes) => {
      menu.hidden = !yes;
      button.setAttribute("aria-expanded", String(yes));
    };
    const close = () => open(false);
    closers.push({ wrap, close });

    button.addEventListener("click", (e) => {
      e.stopPropagation();                       // the document listener would undo this
      const show = menu.hidden;
      closers.forEach((c) => { if (c.wrap !== wrap) c.close(); });
      open(show);
    });

    document.addEventListener("click", (e) => {
      if (!menu.hidden && !wrap.contains(e.target)) close();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && !menu.hidden) {
        close();
        button.focus();                          // put the reader back where they were
      }
    });

    wrap.querySelector("[data-share-copy]").addEventListener("click", async () => {
      let copied = true;
      try {
        // Only available over https and on localhost, which covers the live site
        // and a local preview.
        await navigator.clipboard.writeText(url);
      } catch {
        // Anywhere else, fall back to the older select-then-copy trick so the
        // button never fails silently.
        const box = document.createElement("textarea");
        box.value = url;
        box.setAttribute("readonly", "");
        box.style.cssText = "position:fixed;top:-1000px";
        document.body.appendChild(box);
        box.select();
        copied = document.execCommand("copy");
        box.remove();
      }
      // Confirm in a bubble rather than on the button: both buttons sit at the
      // right-hand end of their row, so a label that changed length would shunt
      // everything sideways and back again.
      close();
      done.lastChild.textContent = copied ? "Link copied" : "Copy failed - use the address bar";
      done.hidden = false;
      setTimeout(() => { done.hidden = true; }, 1600);
    });

    return wrap;
  };

  // ---- the navbar control, on every page ----------------------------------
  // The brand links to the site root from wherever the reader is, so it is the
  // reliable way to name the home page without hard-coding a path - it stays
  // right even if the site is ever served from a subdirectory. Quarto writes that
  // link as ".../index.html"; trimming the filename makes the shared address the
  // tidy one people expect to see.
  const icons = document.querySelector(".navbar-nav.ms-auto");
  const brand = document.querySelector(".navbar-brand");
  if (icons) {
    icons.appendChild(buildControl({
      url: brand ? brand.href.replace(/index\.html$/, "") : location.origin + "/",
      subject: document.querySelector('meta[property="og:site_name"]')?.content || document.title,
      label: "Share this site",
      tag: "li",
      wrapClass: "nav-item compact cwr-share-nav",
      triggerClass: "cwr-share-nav-button nav-link",
      trigger: '<i class="bi bi-share" aria-hidden="true"></i>'
    }));
  }

  // ---- the post control ---------------------------------------------------
  // Only a post has a category row inside the banner, which is what keeps this
  // one off the home page, About and 404.
  const categories = document.querySelector(".quarto-title-banner .quarto-categories");
  if (categories) {
    categories.appendChild(buildControl({
      // Dropping the query string and any #section anchor means a reader who
      // followed a deep link still shares the post rather than the spot they
      // happen to be scrolled to.
      url: location.origin + location.pathname,
      subject: (document.querySelector("h1.title")?.textContent || document.title).trim(),
      label: "Share this post",
      tag: "div",
      wrapClass: "cwr-share-header",
      triggerClass: "cwr-share-button",
      trigger: '<i class="bi bi-share" aria-hidden="true"></i>Share'
    }));
  }
})();
</script>
