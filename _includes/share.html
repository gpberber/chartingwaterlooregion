<!-- ---------------------------------------------------------------------------
     Share control for the post header.

     Adds a "Share" button at the right-hand end of a post's category row, opening
     a small menu with two choices: copy the link, or open an email about it.
     Nothing is sent anywhere and no third-party script is loaded - the copy uses
     the browser's own clipboard and the email is an ordinary mailto: link that
     opens the reader's mail app. That is the reason for building this by hand
     rather than turning on Quarto's `sharing:` option, which only offers Twitter,
     Facebook and LinkedIn and loads their buttons.

     Built in JavaScript rather than in the page template because the title banner
     is generated by Quarto's own Pandoc template. Overriding that template would
     mean keeping a copy of it in step with every Quarto release; finding the
     category row after the page loads costs nothing and cannot break a render.

     Styling lives in custom.scss under "Share button", with the rest of the house
     style. This file is pulled in site-wide by `include-after-body` in _quarto.yml;
     the first line below is what keeps it to posts, since only a post has a
     category row inside the banner.
--------------------------------------------------------------------------- -->
<script>
(() => {
  const row = document.querySelector(".quarto-title-banner .quarto-categories");
  if (!row) return;

  // What gets shared. Dropping the query string and any #section anchor means a
  // reader who followed a deep link still shares the post rather than the spot
  // they happen to be scrolled to.
  const url = location.origin + location.pathname;
  const title = (document.querySelector("h1.title")?.textContent || document.title).trim();
  const mailto = "mailto:?subject=" + encodeURIComponent(title) +
                 "&body=" + encodeURIComponent(title + "\n\n" + url);

  const share = document.createElement("div");
  share.className = "cwr-share";
  share.innerHTML = `
    <button type="button" class="cwr-share-button" aria-expanded="false" aria-controls="cwr-share-menu">
      <i class="bi bi-share" aria-hidden="true"></i>Share
    </button>
    <div class="cwr-share-menu" id="cwr-share-menu" role="menu" hidden>
      <button type="button" class="cwr-share-item" role="menuitem" data-copy>
        <i class="bi bi-link-45deg" aria-hidden="true"></i>Copy link
      </button>
      <a class="cwr-share-item" role="menuitem" href="${mailto}">
        <i class="bi bi-envelope" aria-hidden="true"></i>Email
      </a>
    </div>
    <p class="cwr-share-done" role="status" hidden>
      <i class="bi bi-check2" aria-hidden="true"></i>Link copied
    </p>`;
  row.appendChild(share);

  const button = share.querySelector(".cwr-share-button");
  const menu   = share.querySelector(".cwr-share-menu");
  const done   = share.querySelector(".cwr-share-done");
  const copyItem = share.querySelector("[data-copy]");

  // `hidden` rather than a display rule, so the menu is out of the accessibility
  // tree as well as off the screen while it is shut.
  const open = (yes) => {
    menu.hidden = !yes;
    button.setAttribute("aria-expanded", String(yes));
  };

  button.addEventListener("click", (e) => {
    e.stopPropagation();          // the document listener below would shut it again
    open(menu.hidden);
  });

  document.addEventListener("click", (e) => {
    if (!menu.hidden && !share.contains(e.target)) open(false);
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !menu.hidden) {
      open(false);
      button.focus();             // put the reader back where they were
    }
  });

  copyItem.addEventListener("click", async () => {
    let copied = true;
    try {
      // Only available over https and on localhost, which covers the live site
      // and a local preview.
      await navigator.clipboard.writeText(url);
    } catch {
      // Anywhere else, fall back to the older select-then-copy trick so the
      // button never fails silently.
      const box = document.createElement("textarea");
      box.value = url;
      box.setAttribute("readonly", "");
      box.style.cssText = "position:fixed;top:-1000px";
      document.body.appendChild(box);
      box.select();
      copied = document.execCommand("copy");
      box.remove();
    }
    // Confirm in a bubble where the menu was, rather than on the button: the
    // button is the right-hand end of the row, so a label that changed length
    // would shunt its left edge sideways and back again.
    open(false);
    done.lastChild.textContent = copied ? "Link copied" : "Copy failed - use the address bar";
    done.hidden = false;
    setTimeout(() => { done.hidden = true; }, 1600);
  });
})();
</script>
