# Defaults applied to every post under posts/. A post can override any of these
# in its own YAML header. Site-wide settings live in _quarto.yml.

title-block-banner: true
author: "Greg Berberich"
date-modified: last-modified

# Adds a "Reusing this post" box at the end of every post (heading set in _quarto.yml).
# Text and charts are CC BY 4.0; code is MIT (see LICENSE and LICENSE-CONTENT.md).
license:
  text: "The text and charts in this post are free to copy, share, or republish, including in the news, as long as you credit Charting Waterloo Region and link to the post (Creative Commons CC BY 4.0). The code is MIT licensed; data stays under the licence of its original source, listed above."
  url: https://creativecommons.org/licenses/by/4.0/

# Posts show prose, charts, and tables, not code. Readers who want the code use
# the "view source" link in the page header or clone the repo (see reproduce.qmd).
execute:
  echo: false
  warning: false
  message: false

# Chart defaults; set fig-height / fig-width per chunk when a chart needs it.
fig-width: 8
fig-height: 5
fig-align: center
tbl-cap-location: bottom

crossref:
  fig-prefix: Figure
  tbl-prefix: Table
